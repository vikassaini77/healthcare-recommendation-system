version: '3.8'

services:
  backend:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: medvision_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Pass through environment variables (must be present in .env or system env)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=sqlite:///./healthcare.db
      # Add other necessary env vars here
    volumes:
      # Optional: persist uploaded images or logs if needed
      - ../../models:/app/ml/models
      - ../../healthcare.db:/app/healthcare.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: medvision_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  model_data:
