name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
        
    - name: Install backend dependencies
      working-directory: ./apps/api
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 black
        
    - name: Lint with flake8
      working-directory: ./apps/api
      run: |
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Run Backend Tests
      working-directory: ./apps/api
      run: |
        pytest --cov=src tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: './apps/web/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./apps/web
      run: npm ci || npm install
      
    - name: Build frontend
      working-directory: ./apps/web
      run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint-and-test-backend, build-frontend]
    steps:
    - uses: actions/checkout@v3
    - name: Build backend image
      run: docker build -t healthcare-api:test -f apps/api/Dockerfile apps/api
    - name: Build frontend image
      run: docker build -t healthcare-web:test -f apps/web/Dockerfile apps/web

  security-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Run safety check on python dependencies
      working-directory: ./apps/api
      run: |
        pip install safety
        safety check -r requirements.txt || true
